{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>eDXX | {% trans "Login" %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-accent: #00f2fe;
            --secondary-accent: #4facfe;
            --glass-bg: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.22);
            --glass-input: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #cbd5e1;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #0f2027, #203a43);
            background-size: 400% 400%;
            animation: gradientBg 15s ease infinite;
        }

        @keyframes gradientBg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Iluminação e profundidade com esferas em movimento */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(90px);
            z-index: 0;
            pointer-events: none;
        }
        body::before {
            background: rgba(79, 172, 254, 0.35);
            top: 10%;
            left: 15%;
            animation: floatGlow 8s ease-in-out infinite alternate;
        }
        body::after {
            background: rgba(0, 242, 254, 0.25);
            bottom: 10%;
            right: 15%;
            animation: floatGlow 10s ease-in-out infinite alternate-reverse;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -40px) scale(1.15); }
        }

        .main-wrapper {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .logo-area { 
            text-align: center; 
            margin-bottom: 25px; 
            color: var(--text-main); 
        }

        .logo-icon-wrapper {
            width: 70px;
            height: 70px;
            margin: 0 auto 12px;
            background: linear-gradient(135deg, rgba(79, 172, 254, 0.2), rgba(0, 242, 254, 0.2));
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
            backdrop-filter: blur(10px);
        }

        .logo-area i { 
            font-size: 32px; 
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-area h1 { 
            font-size: 28px; 
            font-weight: 700; 
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .logo-area p { 
            font-size: 14px; 
            color: var(--text-muted);
            margin-top: 4px;
            font-weight: 500;
        }

        .login-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            width: 100%;
            border-radius: 24px;
            padding: 30px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--glass-input);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 0 15px;
            transition: all 0.3s ease;
        }

        .input-wrapper:focus-within {
            border-color: var(--primary-accent);
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.25);
            background: rgba(255, 255, 255, 0.12);
        }

        /* Suporte para inputs gerados dinamicamente pelo Django */
        .input-wrapper input {
            width: 100%;
            padding: 14px 0;
            border: none;
            background: transparent;
            font-size: 14px;
            color: var(--text-main);
            outline: none;
            font-family: 'Inter', sans-serif;
        }

        .input-wrapper input::placeholder {
            color: #94a3b8;
        }

        .input-wrapper i.input-icon {
            color: #94a3b8;
            margin-right: 12px;
            font-size: 16px;
        }

        .toggle-password { 
            cursor: pointer; 
            color: #94a3b8; 
            margin-left: 10px; 
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: var(--primary-accent);
        }

        .options-row {
            display: flex;
            align-items: center;
            margin: 15px 0 20px 2px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .options-row input[type="checkbox"] {
            margin-right: 8px;
            accent-color: var(--primary-accent);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .options-row label {
            cursor: pointer;
            user-select: none;
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #0f172a;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 5px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0, 242, 254, 0.3);
            letter-spacing: 0.5px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(0, 242, 254, 0.45);
            filter: brightness(1.05);
        }

        .register-footer { 
            text-align: center; 
            margin-top: 22px; 
            color: var(--text-muted); 
            font-size: 14px; 
            line-height: 1.5;
        }

        .register-footer a { 
            color: var(--primary-accent); 
            font-weight: 700; 
            text-decoration: none; 
            transition: opacity 0.2s;
        }

        .register-footer a:hover {
            text-decoration: underline;
        }

        .support-link {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            opacity: 0.85;
        }

        .support-link a {
            color: var(--text-main);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }

        .support-link a:hover { 
            color: var(--primary-accent); 
            text-decoration: underline; 
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="logo-area">
            <div class="logo-icon-wrapper">
                <i class="fa-solid fa-chart-line"></i>
            </div>
            <h1>eDXX</h1>
            <p>{% trans "Plataforma de Educação Financeira" %}</p>
        </div>

        <div class="login-card">
            <form method="post" class="auth-form">
                {% csrf_token %}

                <div class="form-group">
                    <label>{% trans "Número de Telefone (Celular)" %}</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user input-icon"></i>
                        {{ form.username }}
                    </div>
                </div>

                <div class="form-group">
                    <label>{% trans "Sua Senha" %}</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        {{ form.password }}
                        <i class="fa-solid fa-eye-slash toggle-password" id="togglePass"></i>
                    </div>
                </div>

                <div class="options-row">
                    <input type="checkbox" id="remember" checked>
                    <label for="remember">{% trans "Lembrar meus dados" %}</label>
                </div>
                
                <button type="submit" class="btn-login">{% trans "ENTRAR" %}</button>
            </form>
        </div>

        <div class="register-footer">
            {% trans "Não tem uma conta?" %} <br>
            <a href="{% url 'cadastro' %}">{% trans "Cadastrar-se" %}</a>
        </div>

        <div class="support-link">
            <a href="#">
                <i class="fa-solid fa-headset"></i>
                {% trans "Suporte Online" %}
            </a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Captura os inputs renderizados pelo Django e aplica atributos e restrições
            const userInp = document.querySelector('input[name="username"]');
            const passInp = document.querySelector('input[name="password"]');
            
            if(userInp) {
                userInp.placeholder = '940 000 000';
                userInp.setAttribute('required', 'true');
                userInp.setAttribute('maxlength', '12');
                userInp.setAttribute('inputmode', 'numeric');
                userInp.addEventListener('input', function() {
                    this.value = this.value.replace(/[^0-9]/g, '').slice(0, 12);
                });
            }
            if(passInp) {
                passInp.placeholder = '••••••••';
                passInp.setAttribute('required', 'true');
                passInp.addEventListener('input', function() {
                    this.value = this.value.replace(/[^a-zA-Z0-9]/g, '');
                });
            }

            // Script para alternar visibilidade da senha
            const togglePass = document.getElementById('togglePass');
            if(togglePass && passInp) {
                togglePass.addEventListener('click', function() {
                    const type = passInp.getAttribute('type') === 'password' ? 'text' : 'password';
                    passInp.setAttribute('type', type);
                    this.classList.toggle('fa-eye');
                    this.classList.toggle('fa-eye-slash');
                });
            }
        });
    </script>
</body>
</html>
